name: Diesel simulation CI

on:
  push:
    branches:
      - diesel-simulator
  pull_request:

jobs:
  windows-tests:
    runs-on: windows-2025

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Flex and Bison
        shell: pwsh
        run: choco install winflexbison3 --yes --no-progress

      - name: Install native dependencies
        shell: pwsh
        run: >-
          vcpkg install
          sdl2:x64-windows
          sdl2-image:x64-windows
          boost-filesystem:x64-windows

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build
          -A x64
          -DDISCORD_ENABLED=OFF
          "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build tests
        run: cmake --build build --config Release --target engine-sim-test

      - name: Build application
        run: cmake --build build --config Release --target engine-sim-app

      - name: Run required tests
        shell: pwsh
        run: |
          $knownUpstreamFailures = '^(GasSystemTests\.(PressureEquilibriumMaxFlow|PressureEquilibriumMaxFlowInfinite|PressureEquilibriumMaxFlowInfiniteOverpressure)|FunctionTests\.FunctionGaussianTest|SynthesizerTests\.(SynthesizerSystemTestSingleThread|SynthesizerSystemTest))$'
          ctest --test-dir build -C Release --output-on-failure -E $knownUpstreamFailures

      - name: Report known upstream test failures
        continue-on-error: true
        shell: pwsh
        run: |
          $knownUpstreamFailures = '^(GasSystemTests\.(PressureEquilibriumMaxFlow|PressureEquilibriumMaxFlowInfinite|PressureEquilibriumMaxFlowInfiniteOverpressure)|FunctionTests\.FunctionGaussianTest|SynthesizerTests\.(SynthesizerSystemTestSingleThread|SynthesizerSystemTest))$'
          ctest --test-dir build -C Release --output-on-failure -R $knownUpstreamFailures

      - name: Package application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package/bin, package/assets, package/delta, package/es | Out-Null
          Copy-Item build/Release/engine-sim-app.exe package/bin/
          Copy-Item build/Release/engine-sim-app.map package/bin/
          Copy-Item build/Release/*.dll package/bin/ -ErrorAction SilentlyContinue
          Copy-Item configuration/delta.conf package/bin/
          Copy-Item assets/* package/assets/ -Recurse
          Copy-Item es/* package/es/ -Recurse
          Copy-Item dependencies/submodules/delta-studio/engines/basic/* package/delta/ -Recurse
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $visualStudio = & $vswhere -latest -products * -property installationPath
          $crtDirectory = Get-ChildItem "$visualStudio/VC/Redist/MSVC" -Recurse -Directory |
            Where-Object {
              $_.FullName -match `
                '[\\/]MSVC[\\/][0-9.]+[\\/]x64[\\/]Microsoft\.VC\d+\.CRT$'
            } |
            Sort-Object { [version]$_.Parent.Parent.Name } -Descending |
            Select-Object -First 1
          if ($null -eq $crtDirectory) {
            throw "Microsoft Visual C++ x64 runtime directory was not found"
          }
          Copy-Item "$($crtDirectory.FullName)/*.dll" package/bin/
          $directXRedist = Join-Path $env:RUNNER_TEMP 'directx_Jun2010_redist.exe'
          $directXFiles = Join-Path $env:RUNNER_TEMP 'directx_Jun2010'
          New-Item -ItemType Directory -Force $directXFiles | Out-Null
          Invoke-WebRequest `
            'https://download.microsoft.com/download/8/4/a/84a35bf1-dafe-4ae8-82af-ad2ae20b6b14/directx_Jun2010_redist.exe' `
            -OutFile $directXRedist
          & tar.exe -xf $directXRedist -C $directXFiles `
            Jun2010_D3DCompiler_43_x64.cab `
            Jun2010_d3dx10_43_x64.cab `
            Jun2010_d3dx11_43_x64.cab
          & expand.exe "$directXFiles/Jun2010_D3DCompiler_43_x64.cab" -F:D3DCompiler_43.dll package/bin
          & expand.exe "$directXFiles/Jun2010_d3dx10_43_x64.cab" -F:d3dx10_43.dll package/bin
          & expand.exe "$directXFiles/Jun2010_d3dx11_43_x64.cab" -F:d3dx11_43.dll package/bin
          if (
            -not (Test-Path package/bin/D3DCompiler_43.dll) `
            -or -not (Test-Path package/bin/d3dx10_43.dll) `
            -or -not (Test-Path package/bin/d3dx11_43.dll)) {
            throw 'Required DirectX runtime libraries were not extracted'
          }

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: engine-sim-diesel-windows
          path: package
          if-no-files-found: error
