name: Diesel simulation CI

on:
  push:
    branches:
      - diesel-simulator
  pull_request:

jobs:
  windows-tests:
    runs-on: windows-2025

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Flex and Bison
        shell: pwsh
        run: choco install winflexbison3 --yes --no-progress

      - name: Install native dependencies
        shell: pwsh
        run: >-
          vcpkg install
          sdl2:x64-windows
          sdl2-image:x64-windows
          boost-filesystem:x64-windows

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build
          -A x64
          -DDISCORD_ENABLED=OFF
          "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build tests
        run: cmake --build build --config Release --target engine-sim-test

      - name: Build application
        run: cmake --build build --config Release --target engine-sim-app

      - name: Run required tests
        shell: pwsh
        run: |
          $knownUpstreamFailures = '^(GasSystemTests\.(PressureEquilibriumMaxFlow|PressureEquilibriumMaxFlowInfinite|PressureEquilibriumMaxFlowInfiniteOverpressure)|FunctionTests\.FunctionGaussianTest|SynthesizerTests\.(SynthesizerSystemTestSingleThread|SynthesizerSystemTest))$'
          ctest --test-dir build -C Release --output-on-failure -E $knownUpstreamFailures

      - name: Report known upstream test failures
        continue-on-error: true
        shell: pwsh
        run: |
          $knownUpstreamFailures = '^(GasSystemTests\.(PressureEquilibriumMaxFlow|PressureEquilibriumMaxFlowInfinite|PressureEquilibriumMaxFlowInfiniteOverpressure)|FunctionTests\.FunctionGaussianTest|SynthesizerTests\.(SynthesizerSystemTestSingleThread|SynthesizerSystemTest))$'
          ctest --test-dir build -C Release --output-on-failure -R $knownUpstreamFailures

      - name: Package application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package/bin, package/assets, package/delta | Out-Null
          Copy-Item build/Release/engine-sim-app.exe package/bin/
          Copy-Item build/Release/*.dll package/bin/ -ErrorAction SilentlyContinue
          Copy-Item configuration/delta.conf package/bin/
          Copy-Item assets/* package/assets/ -Recurse
          Copy-Item dependencies/submodules/delta-studio/engines/basic/* package/delta/ -Recurse
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $visualStudio = & $vswhere -latest -products * -property installationPath
          $crtDirectory = Get-ChildItem "$visualStudio/VC/Redist/MSVC" -Recurse -Directory |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]Microsoft\.VC\d+\.CRT$' } |
            Select-Object -First 1
          if ($null -eq $crtDirectory) {
            throw "Microsoft Visual C++ x64 runtime directory was not found"
          }
          Copy-Item "$($crtDirectory.FullName)/*.dll" package/bin/
          $d3dxLibraries = 'd3dx10_43.dll', 'd3dx11_43.dll'
          foreach ($library in $d3dxLibraries) {
            $source = Join-Path "$env:WINDIR/System32" $library
            if (-not (Test-Path $source)) {
              throw "DirectX runtime library was not found: $library"
            }
            Copy-Item $source package/bin/
          }

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: engine-sim-diesel-windows
          path: package
          if-no-files-found: error
