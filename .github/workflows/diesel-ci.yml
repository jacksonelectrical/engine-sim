name: Diesel simulation CI

on:
  push:
    branches:
      - diesel-simulator
  pull_request:

jobs:
  windows-tests:
    runs-on: windows-2025

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Flex and Bison
        shell: pwsh
        run: choco install winflexbison3 --yes --no-progress

      - name: Install native dependencies
        shell: pwsh
        run: >-
          vcpkg install
          sdl2:x64-windows
          sdl2-image:x64-windows
          boost-filesystem:x64-windows

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build
          -A x64
          -DDISCORD_ENABLED=OFF
          "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build tests
        run: cmake --build build --config Release --target engine-sim-test

      - name: Build application
        run: cmake --build build --config Release --target engine-sim-app

      - name: Run required tests
        shell: pwsh
        run: |
          $knownUpstreamFailures = '^(GasSystemTests\.(PressureEquilibriumMaxFlow|PressureEquilibriumMaxFlowInfinite|PressureEquilibriumMaxFlowInfiniteOverpressure)|FunctionTests\.FunctionGaussianTest|SynthesizerTests\.(SynthesizerSystemTestSingleThread|SynthesizerSystemTest))$'
          ctest --test-dir build -C Release --output-on-failure -E $knownUpstreamFailures

      - name: Report known upstream test failures
        continue-on-error: true
        shell: pwsh
        run: |
          $knownUpstreamFailures = '^(GasSystemTests\.(PressureEquilibriumMaxFlow|PressureEquilibriumMaxFlowInfinite|PressureEquilibriumMaxFlowInfiniteOverpressure)|FunctionTests\.FunctionGaussianTest|SynthesizerTests\.(SynthesizerSystemTestSingleThread|SynthesizerSystemTest))$'
          ctest --test-dir build -C Release --output-on-failure -R $knownUpstreamFailures

      - name: Package application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package/bin, package/assets, package/delta | Out-Null
          Copy-Item build/Release/engine-sim-app.exe package/bin/
          Copy-Item build/Release/*.dll package/bin/ -ErrorAction SilentlyContinue
          Copy-Item configuration/delta.conf package/bin/
          Copy-Item assets/* package/assets/ -Recurse
          Copy-Item dependencies/submodules/delta-studio/engines/basic/* package/delta/ -Recurse

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: engine-sim-diesel-windows
          path: package
          if-no-files-found: error
